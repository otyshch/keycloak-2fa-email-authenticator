# Theme inheritance - works with any parent theme
parent=keycloak.v2

# Import common resources
import=common/keycloak

# Theme metadata
name=Email Code Theme
displayName=Email Code 2FA Theme - Working Version
version=1.0.0

# Supported locales
locales=en,fr,it,tr

# CSS file - using working version
styles=css/email-code-working.css

# Form styling
kcFormAreaClass=col-md-5
kcFormCardClass=card-pf
kcInputClass=form-control
kcButtonClass=btn
kcButtonPrimaryClass=btn-primary
kcButtonDefaultClass=btn-default
kcButtonLargeClass=btn-lg

# Custom properties
emailCode.working=true
